<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كاشير المتجر</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f1ea;--card:#fff;--tx:#1a2420;--mut:#6e776f;--pr:#0d6b55;--prt:#fff;--bd:#e7e2d6;--dg:#c0392b;--gold:#b88a2e;--hd1:#0f7a62;--hd2:#094536;--sh:0 6px 20px rgba(20,40,30,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1210;--card:#161d1a;--tx:#ece9e1;--mut:#93a09a;--pr:#25b88f;--prt:#04221a;--bd:#26302c;--dg:#ef6b5c;--gold:#e0b95f;--hd1:#14382e;--hd2:#0d1210;--sh:0 6px 20px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0d1210;--card:#161d1a;--tx:#ece9e1;--mut:#93a09a;--pr:#25b88f;--prt:#04221a;--bd:#26302c;--dg:#ef6b5c;--gold:#e0b95f;--hd1:#14382e;--hd2:#0d1210;--sh:0 6px 20px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;padding-bottom:170px}
button,input,select{font-family:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;border-radius:0 0 24px 24px;box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;flex:none;border-radius:13px;background:linear-gradient(135deg,#ecd08a,#b88a2e);display:grid;place-items:center;color:#2a1d00}
h1{font-size:18px;font-weight:800;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h3{margin:18px 0 4px;font-size:16px;font-weight:800}
.pill{flex:none;font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff}
.pill::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;margin-inline-end:6px;background:#f2a65a}.pill.on::before{background:#5ee3b0}
main{padding:16px 14px 0}
.tabs{position:fixed;inset-inline:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:7;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px;background:var(--card);border:1px solid var(--bd);border-radius:26px;box-shadow:0 12px 32px rgba(0,0,0,.18)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border:0;background:none;color:var(--mut);border-radius:20px;font-size:11px;font-weight:700;transition:.2s}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{background:var(--pr);color:var(--prt);box-shadow:0 6px 14px color-mix(in srgb,var(--pr) 40%,transparent)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;white-space:nowrap;padding:8px 14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;font-size:14px;font-weight:600}
.chip.on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
input,select{width:100%;padding:13px 14px;border:1.5px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font-size:16px;transition:.15s}
input:focus,select:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 20%,transparent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.p{display:flex;flex-direction:column;gap:3px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;text-align:right;color:var(--tx);font-size:15px;box-shadow:var(--sh);transition:transform .12s}
.p:active{transform:scale(.97)}.p b{font-weight:700;line-height:1.3}
.p em{font-style:normal;font-weight:800;font-size:17px;color:var(--gold)}.p span{color:var(--mut);font-size:12px}.p.out{opacity:.45}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-top:10px;box-shadow:var(--sh)}
button.row{font:inherit}.row .n{flex:1;min-width:0}.row small{color:var(--mut);display:block;font-size:12.5px;margin-top:2px}
.q{display:flex;align-items:center;gap:8px}
.q button,.btn{border:0;border-radius:14px;background:var(--pr);color:var(--prt);padding:11px 16px;font-size:16px;font-weight:700;box-shadow:0 6px 14px color-mix(in srgb,var(--pr) 30%,transparent);transition:transform .12s}
.q button{width:38px;height:38px;padding:0;display:grid;place-items:center;box-shadow:none;border-radius:12px}
.btn:active,.q button:active{transform:scale(.96)}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none}.btn.d{background:var(--dg);color:#fff;box-shadow:none}.btn:disabled{opacity:.4;box-shadow:none}
.bar{position:fixed;inset-inline:12px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:6;padding:10px 12px;background:var(--card);border:1px solid var(--bd);border-radius:22px;box-shadow:0 12px 32px rgba(0,0,0,.18);display:flex;gap:10px;align-items:center}
.bar .btn{flex:1;padding:14px;font-size:17px}.bar .btn.g{flex:.6}
.tot{font-size:19px;font-weight:800;white-space:nowrap}
.f{display:grid;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-top:12px;box-shadow:var(--sh)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat div{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:var(--sh)}
.stat b{font-size:19px;display:block;font-weight:800}.stat span{color:var(--mut);font-size:12.5px}
.stat div:first-child{background:linear-gradient(135deg,var(--pr),color-mix(in srgb,var(--pr) 55%,#000));color:var(--prt);border:0}.stat div:first-child span{color:inherit;opacity:.85}
.msg{padding:12px;border-radius:14px;background:var(--card);border:1px dashed var(--bd);color:var(--mut);margin:12px 0;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(5,12,9,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-end;z-index:9;overflow:auto}
.sheet{background:var(--card);width:100%;max-height:92%;overflow:auto;border-radius:26px 26px 0 0;padding:12px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;animation:up .25s ease}
.sheet::before{content:'';width:44px;height:5px;border-radius:5px;background:var(--bd);margin:0 auto 2px}
.lbl{color:var(--mut);font-size:14px}label.lbl{display:block;margin-bottom:3px}.ln{display:flex;justify-content:space-between;gap:8px}
video{width:100%;border-radius:14px;background:#000}
.badge{min-width:46px;text-align:center;padding:6px 12px;border-radius:999px;font-weight:800;font-size:14px;background:var(--bd);color:var(--tx)}
.bo{background:var(--dg);color:#fff}.bl{background:#e6a23c;color:#241800}.bk{background:color-mix(in srgb,var(--pr) 16%,transparent);color:var(--pr)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fx{animation:fade .3s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body>*:not(#modal){display:none!important}.modal{position:static;background:none;backdrop-filter:none}.noprint,.sheet::before{display:none!important}.sheet{border-radius:0;max-height:none}}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l,c){var d=document.createElement('pre');d.style.cssText='white-space:pre-wrap;padding:12px;margin:12px;border:2px solid #c0392b;border-radius:10px;font:13px monospace;direction:ltr;background:#fff;color:#000';d.textContent='Page error:\n'+m+'\nline '+l+':'+c;(document.body||document.documentElement).appendChild(d)};window.addEventListener('unhandledrejection',function(e){window.onerror(String((e.reason&&e.reason.stack)||e.reason),'',0,0)});</script>
<header><div class="brand"><span class="logo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 13H5z"/><path d="M9 7a3 3 0 016 0"/></svg></span><h1 id="ttl">كاشير المتجر</h1></div><span id="st" class="pill"></span></header>
<div class="tabs" id="tabs"></div>
<div id="cam"></div>
<main id="app"></main>
<div id="bar"></div>
<div id="modal"></div>
<div id="modal2"></div>
<script>
const $=s=>document.querySelector(s);
let db=null,dl=null,products=[],sales=[],exps=[],cart={},tab='sell',q='',cat='',online=false,per='today';
let S={cur:'',store:'',tax:0,low:3,footer:'شكراً لزيارتكم'};
const r2=n=>{n=Number(n)||0;const a=Math.abs(n),v=Number(Math.round(a+'e2')+'e-2');return (isNaN(v)?Math.round(a*100)/100:v)*(n<0?-1:1)};
const fmt=n=>{const v=r2(n),f=Number.isInteger(v)?0:2;return '\u2066'+v.toLocaleString('en-US',{minimumFractionDigits:f,maximumFractionDigits:2})+(S.cur?' '+S.cur:'')+'\u2069'};
const dt=t=>new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
const dd=t=>new Date(t).toLocaleDateString('en-GB');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC={more:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>',sell:'<svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11l2-8H6"/></svg>',prod:'<svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>',inv:'<svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5z"/><path d="M2 12l10 5 10-5"/><path d="M2 17l10 5 10-5"/></svg>',rep:'<svg viewBox="0 0 24 24"><path d="M4 20V11M10 20V4M16 20v-6M22 20H2"/></svg>',set:'<svg viewBox="0 0 24 24"><path d="M4 6h9M19 6h1M4 12h3M13 12h7M4 18h11M21 18h-1"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>'};
const TABS=[['sell','البيع'],['prod','المنتجات'],['inv','المخزون'],['rep','التقارير'],['more','المزيد']];
const METH={cash:'نقداً',card:'بطاقة',transfer:'تحويل',credit:'آجل'};
const guard=p=>p.catch(e=>{alert('تعذّر الحفظ: '+(e&&e.message||e))});
const cl=()=>{$('#modal').innerHTML=''};

function render(){
  $('#st').textContent=online?'متصل':'غير متصل';$('#st').className='pill '+(online?'on':'off');
  $('#ttl').textContent=S.store||'كاشير المتجر';
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="${(tab===k||(k==='more'&&['cust','close','stk','set'].includes(tab)))?'on':''}" onclick="go('${k}')">${IC[k]}<span>${l}</span></button>`).join('');
  $('#bar').innerHTML='';
  ({sell,prod,inv,rep,set,more,cust:custTab,close:closeTab,stk:stocktake})[tab]();
}
const go=t=>{if(t!=='sell')stopCam();tab=t;render();const a=$('#app');a.classList.remove('fx');void a.offsetWidth;a.classList.add('fx')};
const cats=()=>[...new Set(products.map(p=>p.cat).filter(Boolean))];
const cartItems=()=>Object.keys(cart).map(id=>({p:products.find(x=>x.id===id),n:cart[id]})).filter(x=>x.p);

function sell(){
  const list=products.filter(p=>(!cat||p.cat===cat)&&(!q||nz(p.name).includes(nz(q))||(p.code||'')===q.trim()));
  const items=cartItems(),sub=r2(items.reduce((s,x)=>s+lt(x.p,x.n),0));
  $('#app').innerHTML=`<div style="display:flex;gap:8px;margin-top:2px"><input id="s" placeholder="بحث أو رمز باركود…" value="${esc(q)}" oninput="q=this.value;if(products.some(p=>p.code&&p.code===q.trim())){byCode(q);$('#s').focus();return}sell();const e=$('#s');e.focus();e.setSelectionRange(q.length,q.length)" onkeydown="if(event.key==='Enter')byCode(q)"><button class="btn" onclick="camBusy||(eng?stopCam():startCam())">${eng||camBusy?'⏹':'📷'}</button><button class="btn g" onclick="snap()">📸</button>${holds().length?`<button class="btn g" onclick="holdsUI()">⏸ ${holds().length}</button>`:''}</div>`+
   (cats().length?`<div class="chips"><button class="chip ${!cat?'on':''}" onclick="cat='';sell()">الكل</button>${cats().map(c=>`<button class="chip ${cat===c?'on':''}" onclick="cat='${esc(c)}';sell()">${esc(c)}</button>`).join('')}</div>`:'')+
   (products.length?'':'<div class="msg">لا توجد منتجات بعد. أضفها من تبويب «المنتجات».</div>')+
   `<div class="grid">${list.map(p=>`<button class="p ${p.stock<=0?'out':''}" onclick="add('${p.id}')"><b>${esc(p.name)}</b><em>${fmt(p.price)}${p.unit==='kg'?'/كغ':''}</em><span>المخزون ${qf(p,p.stock)}</span></button>`).join('')}</div>`+
   (items.length?`<h3 id="cart">السلة (${items.length})</h3>`+items.map(({p,n})=>p.unit==='kg'?`<div class="row"><div class="n">⚖ ${esc(p.name)}<small>${qf(p,n)} · ${fmt(lt(p,n))}</small></div><div class="q"><button onclick="wsheet('${p.id}',true)">✎</button><button onclick="rm('${p.id}')">×</button></div></div>`:`<div class="row"><div class="n">${esc(p.name)}<small>${fmt(lt(p,n))}</small></div><div class="q"><button onclick="chg('${p.id}',-1)">−</button><b>${n}</b><button onclick="chg('${p.id}',1)">+</button></div></div>`).join(''):'');
  $('#bar').innerHTML=`<div class="bar"><div class="tot" onclick="const c=document.getElementById('cart');if(c)c.scrollIntoView({behavior:'smooth',block:'center'})">${fmt(sub)}${items.length?`<small class="lbl" style="display:block;font-size:11px;font-weight:600">${items.length} صنف · اضغط للعرض</small>`:''}</div><button class="btn g" ${items.length?'':'disabled'} onclick="cart={};sell()">تفريغ</button><button class="btn g" ${items.length?'':'disabled'} onclick="hold()">⏸</button><button class="btn" ${items.length?'':'disabled'} onclick="pay()">الدفع</button></div>`;
}
const r3=n=>Math.round((Number(n)||0)*1000)/1000,r6=n=>Math.round((Number(n)||0)*1e6)/1e6,lt=(p,n)=>r2(p.price*n);
function qf(p,q){q=Number(q)||0;if(p&&p.unit==='kg')return q<1?Math.round(q*1000)+' غ':r3(q)+' كغ';return String(r3(q))}
let wM=1,wq=0;
function wsheet(id,edit){
  const p=products.find(x=>x.id===id);if(!p)return;const cur=cart[id]||0;wM=1;
  $('#modal').innerHTML=`<div class="modal"><div class="sheet"><h3 style="margin:0">⚖ ${esc(p.name)}</h3><div class="lbl">السعر ${fmt(p.price)} للكيلو · المتوفر ${qf(p,p.stock)}</div>
  <div class="two"><button class="chip on" id="wm1" onclick="wmode(1)">بالمبلغ (دينار)</button><button class="chip" id="wm2" onclick="wmode(2)">بالوزن (غرام)</button></div>
  <input id="wv" type="number" inputmode="decimal" step="any" placeholder="المبلغ المطلوب" oninput="wcalc('${id}')">
  <div id="wr" class="tot" style="text-align:center;min-height:56px"></div>
  <button class="btn" onclick="wadd('${id}',${edit?1:0})">${edit?'تحديث السلة':'إضافة للسلة'}</button><button class="btn g" onclick="cl()">إلغاء</button></div></div>`;
  if(edit&&cur){wmode(2);$('#wv').value=Math.round(cur*1000);wcalc(id)}
  setTimeout(()=>{const e=$('#wv');e&&e.focus()},50);
}
function wmode(m){wM=m;$('#wm1').classList.toggle('on',m===1);$('#wm2').classList.toggle('on',m===2);$('#wv').placeholder=m===1?'المبلغ المطلوب':'الوزن بالغرام';$('#wv').value='';$('#wr').textContent='';wq=0}
function wcalc(id){const p=products.find(x=>x.id===id),v=parseFloat($('#wv').value)||0;wq=wM===1?(p.price>0?r6(v/p.price):0):r6(v/1000);
  const over=wq>p.stock+1e-9;$('#wr').innerHTML=wq>0?`الوزن: ${qf(p,wq)}<br>المبلغ: ${fmt(lt(p,wq))}${over?'<br><span style="color:var(--dg);font-size:14px">⚠ يتجاوز المخزون</span>':''}`:''}
function wadd(id,edit){const p=products.find(x=>x.id===id);if(!p||!(wq>0))return;const n=edit?wq:r6((cart[id]||0)+wq);
  if(n>p.stock+1e-9){alert('المخزون غير كافٍ. المتوفر: '+qf(p,p.stock));return}cart[id]=n;cl();sell()}
function rm(id){delete cart[id];sell()}

function add(id){const p=products.find(x=>x.id===id);if(!p)return;if(p.unit==='kg'){if(p.stock<=0){toast('نفد المخزون');return}wsheet(id);return}if(p.stock<=(cart[id]||0))return;cart[id]=(cart[id]||0)+1;sell()}
function chg(id,d){const p=products.find(x=>x.id===id),n=(cart[id]||0)+d;if(n<=0)delete cart[id];else if(p&&n<=p.stock)cart[id]=n;sell()}
function byCode(c){const p=products.find(x=>x.code&&x.code===c.trim());if(p){add(p.id);q='';sell()}}
let zxP=null;
function zx(){if(window.ZXing)return Promise.resolve(window.ZXing);return zxP||(zxP=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=()=>ok(window.ZXing);s.onerror=()=>{zxP=null;no()};document.head.appendChild(s)}))}
let eng=null,camBusy=false,camTok=0,camFace='user',lastC='',lastCT=0,actx=null,_rd=null;
function camAllowed(){try{const pp=document.permissionsPolicy||document.featurePolicy;return pp?pp.allowsFeature('camera'):null}catch(e){return null}}
function camErr(e){const n=e&&e.name;
  if(camAllowed()===false)return 'هذه الصفحة تعمل داخل إطار يمنع الكاميرا المباشرة. استخدم زر 📸 (مسح بالصورة) أو اكتب الرمز.';
  if(n==='NotAllowedError')return 'إذن الكاميرا مرفوض. اضغط القفل بجانب عنوان الصفحة وفعّل الكاميرا ثم أعد المحاولة، أو استخدم زر 📸.';
  if(n==='NotReadableError')return 'الكاميرا مستخدمة من تطبيق آخر. أغلقه ثم أعد المحاولة.';
  if(n==='NotFoundError'||n==='NoMedia')return 'لم يتم العثور على كاميرا. استخدم زر 📸 أو اكتب الرمز.';
  return 'تعذّر تشغيل الكاميرا ('+(n||(e&&e.message)||'خطأ')+'). استخدم زر 📸.'}
function beep(){try{if(navigator.vibrate)navigator.vibrate(60);if(!actx)return;actx.resume();const o=actx.createOscillator();o.frequency.value=1000;o.connect(actx.destination);o.start();setTimeout(()=>o.stop(),90)}catch(e){}}
function toast(t){let d=$('#toast');if(!d){d=document.createElement('div');d.id='toast';d.style.cssText='position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);inset-inline:12px;background:var(--tx);color:var(--bg);padding:12px;border-radius:12px;z-index:20;text-align:center;font-size:15px';document.body.appendChild(d)}d.textContent=t;d.style.display='block';clearTimeout(d._t);d._t=setTimeout(()=>{d.style.display='none'},2800)}
function torchBtn(en,b){try{if(en.track.getCapabilities().torch){b.style.display='';let on=false;b.onclick=()=>{on=!on;en.track.applyConstraints({advanced:[{torch:on}]})}}}catch(e){}}
async function readers(){
  if(_rd)return _rd;let Z=null;try{Z=await zx()}catch(e){}
  let mfr=null;
  if(Z){const F=Z.BarcodeFormat,h=new Map();h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39,F.ITF,F.QR_CODE,F.DATA_MATRIX]);h.set(Z.DecodeHintType.TRY_HARDER,true);mfr=new Z.MultiFormatReader();mfr.setHints(h)}

async function openEngine(v,face,onCode,msg){
  const {Z,mfr,det}=await readers();
  if(!det&&!mfr){msg('تعذّر تحميل مكتبة القراءة. تحقق من الإنترنت.');return null}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){const e=new Error('no mediaDevices');e.name='NoMedia';throw e}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:face},width:{ideal:1280},height:{ideal:720}}})}
  catch(e){if(e&&(e.name==='NotAllowedError'||e.name==='NotReadableError'))throw e;stream=await navigator.mediaDevices.getUserMedia({video:true})}
  v.srcObject=stream;await v.play();
  const track=stream.getVideoTracks()[0],cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  try{await track.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
  let fin=false,tmr=null,last='',lastT=0,n=0;
  const zdec=(sx,sy,sw,sh,maxw)=>{const k=Math.min(1,maxw/sw);cv.width=Math.round(sw*k);cv.height=Math.round(sh*k);cx.drawImage(v,sx,sy,sw,sh,0,0,cv.width,cv.height);
    try{return mfr.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv)))).getText()}catch(e){return null}};
  const tick=async()=>{if(fin)return;
    try{if(v.videoWidth){let c=null,viaDet=false;
      if(det){const r=await det.detect(v);if(r.length){c=r[0].rawValue;viaDet=true}}
      if(!c&&mfr){const W=v.videoWidth,H=v.videoHeight;n++;c=n%2?zdec(0,H*.3,W,H*.4,1280):zdec(0,0,W,H,1280)}
      if(c&&!fin){if(viaDet||(c===last&&Date.now()-lastT<1500)){last='';onCode(c)}else{last=c;lastT=Date.now()}}}
    }catch(e){}
    if(!fin)tmr=setTimeout(tick,120)};
  tmr=setTimeout(tick,250);
  return {track,stop(){fin=true;clearTimeout(tmr);stream.getTracks().forEach(t=>t.stop())}};
}
async function decodePhoto(f){
  const {Z,mfr,det}=await readers();const bmp=await createImageBitmap(f);

  if(!mfr)return null;
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true}),W=bmp.width,H=bmp.height;
  for(const [y,h] of [[0,H],[H*.25,H*.5],[H*.35,H*.3]])for(const mw of [1600,1000]){const k=Math.min(1,mw/W);cv.width=Math.round(W*k);cv.height=Math.round(h*k);cx.drawImage(bmp,0,y,W,h,0,0,cv.width,cv.height);
    try{return mfr.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv)))).getText()}catch(e){}}
  return null;
}

function makeDb(){
  let pw=localStorage.getItem('pw')||'',authP=null;
  const ask=()=>{if(!authP){authP=new Promise((ok,no)=>{const p=prompt('كلمة المرور:');setTimeout(()=>{authP=null},0);if(p==null)no(new Error('مطلوب كلمة المرور'));else{pw=p;localStorage.setItem('pw',p);ok()}})}return authP};
  const api=async(m,u,b)=>{
    const r=await fetch('/api/'+u,{method:m,headers:{'content-type':'application/json','x-pw':pw},body:b==null?undefined:JSON.stringify(b)});
    if(r.status===401){await ask();return api(m,u,b)}
    if(!r.ok)throw new Error(await r.text());
    return r.status===204?null:r.json()};
  const subs=new Set();
  const tick=async s=>{try{const x=await s.f();const g=JSON.stringify(x.raw);if(g!==s.g){s.g=g;s.cb(x.val)}}catch(e){if(s.er)s.er(e)}};
  const all=()=>subs.forEach(tick);
  const sub=(f,cb,er)=>{const s={f,cb,er,g:null};subs.add(s);tick(s);return()=>subs.delete(s)};
  setInterval(()=>{if(!document.hidden)all()},3000);
  const wr=async(m,u,b)=>{const r=await api(m,u,b);all();return r};
  const snap=(id,d)=>({id,exists:d!=null,data:()=>d});
  const rows=async(col,ord,lim)=>{const r=(await api('GET',col)).map(x=>({id:x.id,d:x.data}));
    if(ord)r.sort((a,b)=>{const x=a.d[ord[0]],y=b.d[ord[0]];return(x>y?1:x<y?-1:0)*(ord[1]==='desc'?-1:1)});
    return lim?r.slice(0,lim):r};
  const docRef=(col,id)=>({
    set:d=>wr('PUT',col+'/'+id,d),update:d=>wr('PATCH',col+'/'+id,d),delete:()=>wr('DELETE',col+'/'+id),
    onSnapshot:(cb,er)=>sub(async()=>{const r=(await rows(col)).find(x=>x.id===id);return{raw:r||null,val:snap(id,r?r.d:null)}},cb,er)});
  const coll=(col,ord,lim)=>({
    orderBy:(f,d)=>coll(col,[f,d||'asc'],lim),limit:n=>coll(col,ord,n),
    add:async d=>({id:(await wr('POST',col,d)).id}),doc:id=>docRef(col,id),
    onSnapshot:(cb,er)=>sub(async()=>{const r=await rows(col,ord,lim);return{raw:r,val:{docs:r.map(x=>snap(x.id,x.d)),size:r.length}}},cb,er)});
  return {collection:c=>coll(c),doc:p=>{const [c,i]=p.split('/');return docRef(c,i)}};
}

  window._cl={cs,rc,out};
  $('#app').innerHTML=back()+`<div class="stat"><div><b>${fmt(cs)}</b><span>مبيعات نقدية اليوم</span></div><div><b>${fmt(rc)}</b><span>مقبوضات ديون</span></div><div><b>${fmt(out)}</b><span>مصروفات اليوم</span></div><div><b>${fmt(oth)}</b><span>بطاقة وتحويل (خارج الدرج)</span></div></div>
  <div class="f"><b>مطابقة الصندوق</b><input id="cf0" type="number" inputmode="decimal" step="any" placeholder="رصيد بداية اليوم في الدرج" oninput="cdf()"><div class="ln"><span class="lbl">المتوقع في الدرج</span><b id="cex"></b></div><input id="cc" type="number" inputmode="decimal" step="any" placeholder="المبلغ الفعلي بعد العدّ" oninput="cdf()"><div id="cdf" class="tot" style="text-align:center"></div><input id="cn" placeholder="ملاحظة (اختياري)"><button class="btn" onclick="saveClose()">حفظ إغلاق اليوم</button></div>
  <h3>سجل الإغلاقات</h3>`+(closings.slice().sort((a,b)=>b.ts-a.ts).slice(0,10).map(c=>`<div class="row"><div class="n">${dt(c.ts)}<small>متوقع ${fmt(c.expected)} · فعلي ${fmt(c.counted)}</small></div><span class="badge ${c.diff<0?'bo':c.diff>0?'bl':'bk'}">${c.diff>0?'+':''}${fmt(c.diff)}</span></div>`).join('')||'<div class="msg">لا توجد إغلاقات سابقة.</div>');cdf();
}
function cdf(){const c=window._cl,f=parseFloat($('#cf0').value)||0,ex=r2(f+c.cs+c.rc-c.out),v=$('#cc').value;$('#cex').textContent=fmt(ex);
  const d=v===''?null:r2(parseFloat(v)-ex);$('#cdf').textContent=d===null?'':d===0?'✔ الصندوق مطابق':(d<0?'عجز: ':'زيادة: ')+fmt(Math.abs(d));$('#cdf').style.color=d<0?'var(--dg)':'var(--pr)'}
async function saveClose(){const c=window._cl,f=parseFloat($('#cf0').value)||0,v=$('#cc').value;if(v===''){alert('أدخل المبلغ الفعلي بعد العدّ');return}
  const ex=r2(f+c.cs+c.rc-c.out),cnt2=r2(parseFloat(v));await put('closings',closings,{ts:Date.now(),float:f,cashSales:c.cs,received:c.rc,out:c.out,expected:ex,counted:cnt2,diff:r2(cnt2-ex),note:$('#cn').value.trim()});toast('✔ تم حفظ الإغلاق');closeTab()}

function stocktake(){
  cnt={};$('#app').innerHTML=back()+`<div class="msg">أدخل الكمية الفعلية بعد العدّ. اترك الخانة فارغة للمنتج الذي لم تعدّه.</div><input id="sq" placeholder="🔍 بحث بالاسم أو الباركود" oninput="stl()"><div id="stl"></div>`;stl();
}
function stl(){const k=nz($('#sq').value);$('#stl').innerHTML=products.filter(p=>!k||nz(p.name).includes(k)||(p.code||'')===$('#sq').value.trim()).sort((a,b)=>a.name.localeCompare(b.name,'ar')).map(p=>`<div class="row"><div class="n">${esc(p.name)}<small>في النظام: ${qf(p,p.stock)}</small></div><input style="width:104px" type="number" step="any" inputmode="decimal" value="${cnt[p.id]==null?'':cnt[p.id]}" placeholder="${p.stock}" oninput="cnt['${p.id}']=this.value;sts()"></div>`).join('');sts()}
function sts(){const d=Object.keys(cnt).map(id=>({p:products.find(x=>x.id===id),c:cnt[id]})).filter(x=>x.p&&x.c!==''&&r3(parseFloat(x.c))!==r3(x.p.stock));
  const val=r2(d.reduce((a,x)=>a+(parseFloat(x.c)-x.p.stock)*(x.p.cost||0),0));
  $('#bar').innerHTML=d.length?`<div class="bar"><div class="tot">${d.length} فرق · ${fmt(val)}</div><button class="btn" onclick="saveStk()">اعتماد الجرد</button></div>`:''}
async function saveStk(){
  const d=Object.keys(cnt).map(id=>({p:products.find(x=>x.id===id),c:cnt[id]})).filter(x=>x.p&&x.c!==''&&r3(parseFloat(x.c))!==r3(x.p.stock));if(!d.length||!confirm('اعتماد '+d.length+' تعديل على المخزون؟'))return;
  const items=d.map(x=>({id:x.p.id,name:x.p.name,sys:x.p.stock,cnt:r3(parseFloat(x.c)),cost:x.p.cost||0}));
  for(const i of items)await upd2('products',products,i.id,()=>({stock:Math.max(0,i.cnt)}));
  await put('adjusts',[],{ts:Date.now(),items,value:r2(items.reduce((a,i)=>a+(i.cnt-i.sys)*i.cost,0))});cnt={};$('#bar').innerHTML='';toast('✔ تم اعتماد الجرد');stocktake()}

function holds(){try{return JSON.parse(localStorage.getItem('holds')||'[]')}catch(e){return[]}}
function saveHolds(h){try{localStorage.setItem('holds',JSON.stringify(h))}catch(e){}}
function hold(){if(!Object.keys(cart).length)return;const h=holds();h.push({t:Date.now(),cart});saveHolds(h);cart={};sell();toast('⏸ تم تعليق الفاتورة')}
function holdsUI(){const h=holds();
  $('#modal').innerHTML=`<div class="modal"><div class="sheet"><h3 style="margin:0">الفواتير المعلّقة</h3>${h.map((x,i)=>{const it=Object.keys(x.cart).map(id=>({p:products.find(p=>p.id===id),n:x.cart[id]})).filter(y=>y.p);return `<div class="row"><div class="n">${dt(x.t)}<small>${it.length} صنف · ${fmt(r2(it.reduce((a,y)=>a+lt(y.p,y.n),0)))}</small></div><div class="q"><button onclick="resume(${i})">↩</button><button onclick="delHold(${i})">×</button></div></div>`}).join('')||'<div class="msg">لا توجد فواتير معلّقة.</div>'}<button class="btn g" onclick="cl()">إغلاق</button></div></div>`}
function resume(i){const h=holds(),x=h[i];if(!x)return;if(Object.keys(cart).length&&!confirm('استبدال السلة الحالية بالفاتورة المعلّقة؟'))return;cart=x.cart;h.splice(i,1);saveHolds(h);cl();sell()}
function delHold(i){const h=holds();h.splice(i,1);saveHolds(h);holdsUI();sell()}
async function backup(){if(!dl){alert('التصدير غير متاح هنا');return}
  const d={v:1,ts:Date.now(),settings:S,products,sales,expenses:exps,customers,payments,closings};
  try{await dl.save({filename:'backup-'+new Date().toISOString().slice(0,10)+'.json',data:JSON.stringify(d)})}catch(e){}}

(async()=>{
  render();
  try{db=makeDb();dl=localDl}catch(e){}
  if(!db){render();return}
  online=true;
  db.collection('products').onSnapshot(s=>{products=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==='prod')plist();else if(['sell','inv','rep'].includes(tab))render()},()=>{online=false;render()});
  db.collection('sales').orderBy('ts','desc').limit(1000).onSnapshot(s=>{sales=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==='rep')rep()},()=>{});
  db.collection('expenses').orderBy('ts','desc').limit(300).onSnapshot(s=>{exps=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==='rep')rep()},()=>{});
  db.collection('customers').onSnapshot(s=>{customers=s.docs.map(d=>({id:d.id,...d.data()}));if(['cust','more'].includes(tab))render()},()=>{});
  db.collection('payments').orderBy('ts','desc').limit(1000).onSnapshot(s=>{payments=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==='close')render()},()=>{});
  db.collection('closings').orderBy('ts','desc').limit(60).onSnapshot(s=>{closings=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==='close')render()},()=>{});
  db.doc('settings/main').onSnapshot(s=>{if(s.exists)S={...S,...s.data()};render()},()=>{});
})();
</script>
