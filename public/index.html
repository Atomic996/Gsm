<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كاشير المتجر</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f1ea;--card:#fff;--tx:#1a2420;--mut:#6e776f;--pr:#0d6b55;--prt:#fff;--bd:#e7e2d6;--dg:#c0392b;--gold:#b88a2e;--hd1:#0f7a62;--hd2:#094536;--sh:0 6px 20px rgba(20,40,30,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1210;--card:#161d1a;--tx:#ece9e1;--mut:#93a09a;--pr:#25b88f;--prt:#04221a;--bd:#26302c;--dg:#ef6b5c;--gold:#e0b95f;--hd1:#14382e;--hd2:#0d1210;--sh:0 6px 20px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0d1210;--card:#161d1a;--tx:#ece9e1;--mut:#93a09a;--pr:#25b88f;--prt:#04221a;--bd:#26302c;--dg:#ef6b5c;--gold:#e0b95f;--hd1:#14382e;--hd2:#0d1210;--sh:0 6px 20px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;padding-bottom:170px}
button,input,select{font-family:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;border-radius:0 0 24px 24px;box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;flex:none;border-radius:13px;background:linear-gradient(135deg,#ecd08a,#b88a2e);display:grid;place-items:center;color:#2a1d00}
h1{font-size:18px;font-weight:800;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h3{margin:18px 0 4px;font-size:16px;font-weight:800}
.pill{flex:none;font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff}
.pill::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;margin-inline-end:6px;background:#f2a65a}.pill.on::before{background:#5ee3b0}
main{padding:16px 14px 0}
.tabs{position:fixed;inset-inline:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:7;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px;background:var(--card);border:1px solid var(--bd);border-radius:26px;box-shadow:0 12px 32px rgba(0,0,0,.18)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border:0;background:none;color:var(--mut);border-radius:20px;font-size:11px;font-weight:700;transition:.2s}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{background:var(--pr);color:var(--prt);box-shadow:0 6px 14px color-mix(in srgb,var(--pr) 40%,transparent)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;white-space:nowrap;padding:8px 14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;font-size:14px;font-weight:600}
.chip.on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
input,select{width:100%;padding:13px 14px;border:1.5px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font-size:16px;transition:.15s}
input:focus,select:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 20%,transparent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.p{display:flex;flex-direction:column;gap:3px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;text-align:right;color:var(--tx);font-size:15px;box-shadow:var(--sh);transition:transform .12s}
.p:active{transform:scale(.97)}.p b{font-weight:700;line-height:1.3}
.p em{font-style:normal;font-weight:800;font-size:17px;color:var(--gold)}.p span{color:var(--mut);font-size:12px}.p.out{opacity:.45}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-top:10px;box-shadow:var(--sh)}
button.row{font:inherit}.row .n{flex:1;min-width:0}.row small{color:var(--mut);display:block;font-size:12.5px;margin-top:2px}
.q{display:flex;align-items:center;gap:8px}
.q button,.btn{border:0;border-radius:14px;background:var(--pr);color:var(--prt);padding:11px 16px;font-size:16px;font-weight:700;box-shadow:0 6px 14px color-mix(in srgb,var(--pr) 30%,transparent);transition:transform .12s}
.q button{width:38px;height:38px;padding:0;display:grid;place-items:center;box-shadow:none;border-radius:12px}
.btn:active,.q button:active{transform:scale(.96)}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none}.btn.d{background:var(--dg);color:#fff;box-shadow:none}.btn:disabled{opacity:.4;box-shadow:none}
.bar{position:fixed;inset-inline:12px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:6;padding:10px 12px;background:var(--card);border:1px solid var(--bd);border-radius:22px;box-shadow:0 12px 32px rgba(0,0,0,.18);display:flex;gap:10px;align-items:center}
.bar .btn{flex:1;padding:14px;font-size:17px}.bar .btn.g{flex:.6}
.tot{font-size:19px;font-weight:800;white-space:nowrap}
.f{display:grid;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-top:12px;box-shadow:var(--sh)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat div{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:var(--sh)}
.stat b{font-size:19px;display:block;font-weight:800}.stat span{color:var(--mut);font-size:12.5px}
.stat div:first-child{background:linear-gradient(135deg,var(--pr),color-mix(in srgb,var(--pr) 55%,#000));color:var(--prt);border:0}.stat div:first-child span{color:inherit;opacity:.85}
.msg{padding:12px;border-radius:14px;background:var(--card);border:1px dashed var(--bd);color:var(--mut);margin:12px 0;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(5,12,9,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-end;z-index:9;overflow:auto}
.sheet{background:var(--card);width:100%;max-height:92%;overflow:auto;border-radius:26px 26px 0 0;padding:12px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;animation:up .25s ease}
.sheet::before{content:'';width:44px;height:5px;border-radius:5px;background:var(--bd);margin:0 auto 2px}
.lbl{color:var(--mut);font-size:14px}label.lbl{display:block;margin-bottom:3px}.ln{display:flex;justify-content:space-between;gap:8px}
video{width:100%;border-radius:14px;background:#000}
.badge{min-width:46px;text-align:center;padding:6px 12px;border-radius:999px;font-weight:800;font-size:14px;background:var(--bd);color:var(--tx)}
.bo{background:var(--dg);color:#fff}.bl{background:#e6a23c;color:#241800}.bk{background:color-mix(in srgb,var(--pr) 16%,transparent);color:var(--pr)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fx{animation:fade .3s ease}
.upill{flex:none;border:0;font:inherit;font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.auth{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;display:grid;place-items:center;padding:20px}.auth:empty{display:none}
.authbox{width:100%;max-width:360px;display:grid;gap:10px;text-align:center}.authbox h2{margin:0;font-size:22px}
.dots{font-size:28px;letter-spacing:6px;min-height:40px;color:var(--pr)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pad button{padding:16px 0;font-size:22px;font-weight:700;border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx)}.pad button:active{transform:scale(.95)}
.lblwrap{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.lb{background:#fff;color:#000;border:1px dashed #999;border-radius:3px;overflow:hidden;display:flex;flex-direction:column;padding:1.2mm;box-sizing:border-box;line-height:1.15;text-align:center;flex:none}
.lb .ln1{font-weight:700;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lb .bc{flex:1;min-height:0;margin:.6mm 0}.lb svg{width:100%;height:100%;display:block}
.lb .cd{font-family:monospace;letter-spacing:.4px;direction:ltr}.lb .pr{font-weight:800}
@media print{body.printlbl{padding:0!important;background:#fff!important}
body.printlbl .modal{display:block!important;overflow:visible!important;position:static!important}
body.printlbl .lblsheet{padding:0!important;gap:0!important;display:block!important;background:#fff!important;max-height:none!important;overflow:visible!important;animation:none!important}
body.printlbl .lblwrap{display:block;gap:0}
body.printlbl .lb{border:0!important;border-radius:0;break-inside:avoid}
body.printlbl .lblwrap.roll .lb{break-after:page;page-break-after:always}body.printlbl .lblwrap.roll .lb:last-child{break-after:auto;page-break-after:auto}
body.printlbl .lblwrap.a4{display:grid;grid-template-columns:repeat(3,70mm);grid-auto-rows:36mm}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body>*:not(#modal){display:none!important}.modal{position:static;background:none;backdrop-filter:none}.noprint,.sheet::before{display:none!important}.sheet{border-radius:0;max-height:none}}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l,c){var d=document.createElement('pre');d.style.cssText='white-space:pre-wrap;padding:12px;margin:12px;border:2px solid #c0392b;border-radius:10px;font:13px monospace;direction:ltr;background:#fff;color:#000';d.textContent='Page error:\n'+m+'\nline '+l+':'+c;(document.body||document.documentElement).appendChild(d)};window.addEventListener('unhandledrejection',function(e){window.onerror(String((e.reason&&e.reason.stack)||e.reason),'',0,0)});</script>
<header><div class="brand"><span class="logo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 13H5z"/><path d="M9 7a3 3 0 016 0"/></svg></span><h1 id="ttl">كاشير المتجر</h1></div><div style="display:flex;gap:6px;flex:none"><button class="upill" id="usr" onclick="userMenu()" style="display:none"></button><span id="st" class="pill"></span></div></header>
<div class="tabs" id="tabs"></div>
<div id="cam"></div>
<main id="app"></main>
<div id="bar"></div>
<div id="modal"></div>
<div id="modal2"></div>
<div id="auth" class="auth"><div class="authbox"><div class="lbl">جارٍ التحميل…</div></div></div>
<script>
const $=s=>document.querySelector(s);
let db=null,dl=null,products=[],sales=[],exps=[],cart={},tab='sell',q='',cat='',online=false,per='today';
let S={cur:'',store:'',tax:0,low:3,footer:'شكراً لزيارتكم'};
const r2=n=>{n=Number(n)||0;const a=Math.abs(n),v=Number(Math.round(a+'e2')+'e-2');return (isNaN(v)?Math.round(a*100)/100:v)*(n<0?-1:1)};
const fmt=n=>{const v=r2(n),f=Number.isInteger(v)?0:2;return '\u2066'+v.toLocaleString('en-US',{minimumFractionDigits:f,maximumFractionDigits:2})+(S.cur?' '+S.cur:'')+'\u2069'};
const dt=t=>new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
const dd=t=>new Date(t).toLocaleDateString('en-GB');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC={more:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>',sell:'<svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11l2-8H6"/></svg>',prod:'<svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>',inv:'<svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5z"/><path d="M2 12l10 5 10-5"/><path d="M2 17l10 5 10-5"/></svg>',rep:'<svg viewBox="0 0 24 24"><path d="M4 20V11M10 20V4M16 20v-6M22 20H2"/></svg>',set:'<svg viewBox="0 0 24 24"><path d="M4 6h9M19 6h1M4 12h3M13 12h7M4 18h11M21 18h-1"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>'};
const TABS=[['sell','البيع'],['prod','المنتجات'],['inv','المخزون'],['rep','التقارير'],['more','المزيد']];
IC.cust='<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17.5 14c2.4.2 4 2 4 5"/></svg>';
const METH={cash:'نقداً',card:'بطاقة',transfer:'تحويل',credit:'آجل'};
const guard=p=>p.catch(e=>{alert('تعذّر الحفظ: '+(e&&e.message||e))});
const cl=()=>{$('#modal').innerHTML=''};
let USER=null,TOK='';try{TOK=localStorage.getItem('tok')||'';USER=JSON.parse(localStorage.getItem('usr')||'null')}catch(e){}
const isMgr=()=>!USER||USER.role!=='cashier',isOwner=()=>!USER||USER.role==='owner';
const RL={owner:'مالك',manager:'مدير',cashier:'كاشير'};
const tabsFor=()=>isMgr()?TABS:[['sell','البيع'],['prod','المنتجات'],['cust','العملاء']];

function render(){
  if(!isMgr()&&!['sell','prod','cust'].includes(tab))tab='sell';
  const tb=tabsFor(),uu=$('#usr');if(uu){uu.style.display=USER?'':'none';uu.textContent=USER?'👤 '+USER.name:''}$('#tabs').style.gridTemplateColumns='repeat('+tb.length+',1fr)';
  $('#st').textContent=online?'متصل':'غير متصل';$('#st').className='pill '+(online?'on':'off');
  $('#ttl').textContent=S.store||'كاشير المتجر';
  $('#tabs').innerHTML=tb.map(([k,l])=>`<button class="${(tab===k||(k==='more'&&['cust','close','stk','set','tre','buy','exp','ana','sup','imp','staff','lbl'].includes(tab)))?'on':''}" onclick="go('${k}')">${IC[k]}<span>${l}</span></button>`).join('');
  $('#bar').innerHTML='';
  ({sell,prod,inv,rep,set,more,cust:custTab,ana,sup:supTab,imp:impTab,close:closeTab,stk:stocktake,tre:treTab,buy:buyTab,exp:expTab,staff:staffTab,lbl:lblTab})[tab]();
}
const go=t=>{if(t!=='sell')stopCam();tab=t;render();const a=$('#app');a.classList.remove('fx');void a.offsetWidth;a.classList.add('fx')};
const cats=()=>[...new Set(products.map(p=>p.cat).filter(Boolean))];
const cartItems=()=>Object.keys(cart).map(id=>({p:products.find(x=>x.id===id),n:cart[id]})).filter(x=>x.p);

function sell(){
  const list=products.filter(p=>(!cat||p.cat===cat)&&(!q||nz(p.name).includes(nz(q))||(p.code||'')===q.trim()));
  const items=cartItems(),sub=r2(items.reduce((s,x)=>s+lt(x.p,x.n),0));
  $('#app').innerHTML=`<div style="display:flex;gap:8px;margin-top:2px"><input id="s" placeholder="بحث أو رمز باركود…" value="${esc(q)}" oninput="q=this.value;if(products.some(p=>p.code&&p.code===q.trim())){byCode(q);$('#s').focus();return}sell();const e=$('#s');e.focus();e.setSelectionRange(q.length,q.length)" onkeydown="if(event.key==='Enter')byCode(q)"><button class="btn" onclick="camBusy||(eng?stopCam():startCam())">${eng||camBusy?'⏹':'📷'}</button><button class="btn g" onclick="snap()">📸</button>${holds().length?`<button class="btn g" onclick="holdsUI()">⏸ ${holds().length}</button>`:''}</div>`+
   (cats().length?`<div class="chips"><button class="chip ${!cat?'on':''}" onclick="cat='';sell()">الكل</button>${cats().map(c=>`<button class="chip ${cat===c?'on':''}" onclick="cat='${esc(c)}';sell()">${esc(c)}</button>`).join('')}</div>`:'')+
   (products.length?'':'<div class="msg">لا توجد منتجات بعد. أضفها من تبويب «المنتجات».</div>')+
   `<div class="grid">${list.map(p=>`<button class="p ${p.stock<=0?'out':''}" onclick="add('${p.id}')"><b>${esc(p.name)}</b><em>${fmt(p.price)}${p.unit==='kg'?'/كغ':''}</em><span>المخزون ${qf(p,p.stock)}</span></button>`).join('')}</div>`+
   (items.length?`<h3 id="cart">السلة (${items.length})</h3>`+items.map(({p,n})=>p.unit==='kg'?`<div class="row"><div class="n">⚖ ${esc(p.name)}<small>${qf(p,n)} · ${fmt(lt(p,n))}</small></div><div class="q"><button onclick="wsheet('${p.id}',true)">✎</button><button onclick="rm('${p.id}')">×</button></div></div>`:`<div class="row"><div class="n">${esc(p.name)}<small>${fmt(lt(p,n))}</small></div><div class="q"><button onclick="chg('${p.id}',-1)">−</button><b>${n}</b><button onclick="chg('${p.id}',1)">+</button></div></div>`).join(''):'');
  $('#bar').innerHTML=`<div class="bar"><div class="tot" onclick="const c=document.getElementById('cart');if(c)c.scrollIntoView({behavior:'smooth',block:'center'})">${fmt(sub)}${items.length?`<small class="lbl" style="display:block;font-size:11px;font-weight:600">${items.length} صنف · اضغط للعرض</small>`:''}</div><button class="btn g" ${items.length?'':'disabled'} onclick="cart={};sell()">تفريغ</button><button class="btn g" ${items.length?'':'disabled'} onclick="hold()">⏸</button><button class="btn" ${items.length?'':'disabled'} onclick="pay()">الدفع</button></div>`;
}
const r3=n=>Math.round((Number(n)||0)*1000)/1000,r6=n=>Math.round((Number(n)||0)*1e6)/1e6,lt=(p,n)=>r2(p.price*n);
function qf(p,q){q=Number(q)||0;if(p&&p.unit==='kg')return q<1?Math.round(q*1000)+' غ':r3(q)+' كغ';return String(r3(q))}
let wM=1,wq=0;
function wsheet(id,edit){
  const p=products.find(x=>x.id===id);if(!p)return;const cur=cart[id]||0;wM=1;
  $('#modal').innerHTML=`<div class="modal"><div class="sheet"><h3 style="margin:0">⚖ ${esc(p.name)}</h3><div class="lbl">السعر ${fmt(p.price)} للكيلو · المتوفر ${qf(p,p.stock)}</div>
  <div class="two"><button class="chip on" id="wm1" onclick="wmode(1)">بالمبلغ (دينار)</button><button class="chip" id="wm2" onclick="wmode(2)">بالوزن (غرام)</button></div>
  <input id="wv" type="number" inputmode="decimal" step="any" placeholder="المبلغ المطلوب" oninput="wcalc('${id}')">
  <div id="wr" class="tot" style="text-align:center;min-height:56px"></div>
  <button class="btn" onclick="wadd('${id}',${edit?1:0})">${edit?'تحديث السلة':'إضافة للسلة'}</button><button class="btn g" onclick="cl()">إلغاء</button></div></div>`;
  if(edit&&cur){wmode(2);$('#wv').value=Math.round(cur*1000);wcalc(id)}
  setTimeout(()=>{const e=$('#wv');e&&e.focus()},50);
}
function wmode(m){wM=m;$('#wm1').classList.toggle('on',m===1);$('#wm2').classList.toggle('on',m===2);$('#wv').placeholder=m===1?'المبلغ المطلوب':'الوزن بالغرام';$('#wv').value='';$('#wr').textContent='';wq=0}
function wcalc(id){const p=products.find(x=>x.id===id),v=parseFloat($('#wv').value)||0;wq=wM===1?(p.price>0?r6(v/p.price):0):r6(v/1000);
  const over=wq>p.stock+1e-9;$('#wr').innerHTML=wq>0?`الوزن: ${qf(p,wq)}<br>المبلغ: ${fmt(lt(p,wq))}${over?'<br><span style="color:var(--dg);font-size:14px">⚠ يتجاوز المخزون</span>':''}`:''}
function wadd(id,edit){const p=products.find(x=>x.id===id);if(!p||!(wq>0))return;const n=edit?wq:r6((cart[id]||0)+wq);
